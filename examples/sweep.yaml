# A small sweep: 2 outer values x 3 inner points = 6 runs of examples/print_args.py,
# which just prints the arguments it receives.
#
# Run from the SlurmDunk directory, since the paths below are relative to it:
#   slurmdunk generate examples/sweep.yaml --dryrun     # inspect the generated script
#   slurmdunk generate examples/sweep.yaml --submit     # submit it
#   slurmdunk collect examples/sweep.yaml --format both # gather results once it has run
#
# Before submitting, set 'partition', 'account' and 'result_database_path' for your cluster.
# result_database_path must be absolute: the generated script changes into the
# executable's directory, so a relative path would point somewhere else.

execution:
  interpreter: python3
  executable: examples/print_args.py

slurm:
  job-name: slurmdunk_example
  partition: small                 # <- your partition
  account: myproject               # <- your project
  time: "00:05:00"
  ntasks: 1
  cpus-per-task: 1

experiment:
  result_database_path: /scratch/myproject/slurmdunk_examples   # <- absolute and writable
  experiment_name: sweep
  slrm_output_dir: SLURM_OUTPUT
  tracking_args:
    save_dir: "{save_dir}_{__indicator}"

args:
  mode: demo

outer_loops:                       # one array element per value
  - type: explicit
    arg_name: scale
    values: [0.5, 2.0]

inner_loop:                        # one run per row, inside each array element
  type: tabular_file
  file_path: examples/points.txt
  arg_names: [x, Q2]

collect:
  formats: [sqlite, csv]
  patterns:
    - 'mode: {mode_echo:str}'      # print_args.py echoes 'mode: demo' back
