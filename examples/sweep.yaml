# A small sweep: 2 outer values x 3 inner points = 6 runs of examples/print_args.py,
# which just prints the arguments it receives.
#
# Relative paths below are taken from this file's folder, so this works from anywhere:
#   slurmdunk generate path/to/examples/sweep.yaml --dryrun     # inspect the generated script
#   slurmdunk generate path/to/examples/sweep.yaml --submit     # submit it
#   slurmdunk collect path/to/examples/sweep.yaml --format both # gather results once it has run
#
# Before submitting, set 'partition' and 'account' for your cluster.

execution:
  interpreter: python3
  executable: print_args.py          # relative paths are taken from this file's folder

slurm:
  job-name: slurmdunk_example
  partition: small                 # <- your partition
  account: myproject               # <- your project
  time: "00:05:00"
  ntasks: 1
  cpus-per-task: 1

experiment:
  result_database_path: results      # <- for real runs, somewhere roomy, e.g. under /scratch
  experiment_name: sweep
  slrm_output_dir: SLURM_OUTPUT
  tracking_args:
    save_dir: "{save_dir}_{run}"

args:
  mode: demo

outer_loops:                       # one array element per value
  - type: explicit
    arg_name: scale
    values: [0.5, 2.0]

inner_loop:                        # one run per row, inside each array element
  type: tabular_file
  file_path: points.txt
  arg_names: [x, Q2]

collect:
  formats: [sqlite, csv]
  patterns:
    - 'mode: {mode_echo:str}'      # print_args.py echoes 'mode: demo' back
