# The sweep from sweep.yaml, but 'scale' and 'x' are passed by position instead of as
# flags (see "Positional arguments" in README.md). Each run calls, for example:
#   python3 print_args.py --mode demo --Q2 10 --save_dir <...> 0.5 0.01
#
# Relative paths are taken from this file's folder; set partition and account first.

execution:
  interpreter: python3
  executable: print_args.py          # relative paths are taken from this file's folder

slurm:
  job-name: slurmdunk_positional
  partition: small                 # <- your partition
  account: myproject               # <- your project
  time: "00:05:00"
  ntasks: 1
  cpus-per-task: 1

experiment:
  result_database_path: results      # <- for real runs, somewhere roomy, e.g. under /scratch
  experiment_name: positional
  slrm_output_dir: SLURM_OUTPUT
  tracking_args:
    save_dir: "{save_dir}_{run}"

args:
  mode: demo

outer_loops:
  - type: explicit
    arg_name: scale
    values: [0.5, 2.0]

inner_loop:
  type: tabular_file
  file_path: points.txt
  arg_names: [x, Q2]

positional_args: [scale, x]        # passed in this order, after the flags
